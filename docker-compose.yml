version: '3.8'

services:
  # ==============================
  # INFRASTRUCTURE
  # ==============================
  postgres:
    image: postgres:15-alpine
    container_name: xness_postgres
    environment:
      POSTGRES_USER: sanjana
      POSTGRES_PASSWORD: sura
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjana"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: xness_redis
    ports:
      - "6379:6379"

  # ==============================
  # APPLICATIONS
  # ==============================
  
  http_server:
    container_name: xness_http
    build:
      context: .
      dockerfile: docker/Dockerfile.http
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://sanjana:sura@postgres:5432/postgres?schema=public"
      REDIS_HOST: "redis" 
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    container_name: xness_web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      INTERNAL_API_URL: "http://http_server:4000"
    depends_on:
      - http_server

  engine:
    container_name: xness_engine
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      DATABASE_URL: "postgresql://sanjana:sura@postgres:5432/postgres?schema=public"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  price_poller:
    container_name: xness_poller
    build:
      context: .
      dockerfile: docker/Dockerfile.poller
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_started
    restart: always

volumes:
  postgres_data: