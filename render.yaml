databases:
  - name: xness-db
    plan: free
    databaseName: postgres
    user: sanjana

services:
  # === Express API Server ===
  - type: web
    name: xness-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.http
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xness-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: xness-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGIN
        value: https://velocity.bitshitfalse.com

  # === Next.js Frontend ===
  - type: web
    name: xness-web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Set manually after xness-api deploys
      - key: INTERNAL_API_URL
        sync: false  # Set manually after xness-api deploys
