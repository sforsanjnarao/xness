# Render Blueprint: free Postgres + one free web service running the whole backend.
databases:
  - name: xness-db
    plan: free
    region: singapore
    databaseName: xness
    user: xness

services:
  - type: web
    name: xness-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xness-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
